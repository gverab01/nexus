# ==============================================================================
# NEXUSREACH PRO - ENTORNO AISLADO DE INTEGRACIÓN POSTGRESQL + RLS (TASK-04B)
# ==============================================================================
# Instrucciones de ejecución:
# 1. Iniciar contenedor de prueba:
#    docker compose -f docker-compose.postgres-test.yml up -d
# 2. Ejecutar la suite de pruebas de integración RLS:
#    TEST_DATABASE_URL="postgresql://nexus_app:app_secure_pass_123@localhost:5432/nexusreach_test" python -m unittest -v tests/test_postgres_rls_integration_task04b.py
# 3. Detener y limpiar contenedor:
#    docker compose -f docker-compose.postgres-test.yml down -v
# ==============================================================================

version: '3.8'

services:
  postgres_test:
    image: postgres:16-alpine
    container_name: nexusreach_postgres_rls_test
    restart: "no"
    environment:
      POSTGRES_DB: nexusreach_test
      POSTGRES_USER: nexus_admin
      POSTGRES_PASSWORD: admin_secure_pass_123
      # Variables para inicialización del usuario de aplicación no privilegiado
      NEXUS_APP_USER: nexus_app
      NEXUS_APP_PASSWORD: app_secure_pass_123
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./schema_postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./scripts/init_postgres_test_roles.sql:/docker-entrypoint-initdb.d/02_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_admin -d nexusreach_test"]
      interval: 2s
      timeout: 5s
      retries: 15

